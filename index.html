<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="background"></div>
    <h1 class="first-heading">
      Word <span class="first-heading--special">Analytics</span>
    </h1>
    <h2>pooratho</h2>
    <div class="container">
      <textarea class="textarea" placeholder="Enter Your Text"></textarea>
      <section class="states">
        <section class="state">
          <span class="state__number state__number--words">0</span>
          <h2 class="second-heading">Words</h2>
        </section>
        <section class="state">
          <span class="state__number state__number--characters">0</span>
          <h2 class="second-heading">Characters</h2>
        </section>
        <section class="state">
          <span class="state__number state__number--twitter">0</span>
          <h2 class="second-heading">Twitter</h2>
        </section>
        <section class="state">
          <span class="state__number state__number--facebook">0</span>
          <h2 class="second-heading">Facebook</h2>
        </section>
      </section>
    </div>

    <footer class="footer">
      <small class="copyright">
        &copy;Copyright by pooratho All rights reserved
      </small>
      <small class="data"> last checked limits: 16 days ago </small>
    </footer>
  </body>
</html>
